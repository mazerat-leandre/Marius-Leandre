<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseUrl = 'https://ghgmifhqgqiqignowred.supabase.co';
  const supabaseKey = 'sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V';

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function loadProducts() {
    const { data, error } = await supabase
      .from('ListeProduit')
      .select('id,article,modele,couleur')
      .limit(10);

    console.log("ERROR:", error);
    console.log("DATA:", data);

    const container = document.getElementById('products');

    if (error) {
      container.innerHTML = `<p style="color:red;"><b>Erreur Supabase:</b> ${error.message}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `<p>Aucun produit retourné (data.length = 0).</p>`;
      return;
    }

    container.innerHTML = data
      .map(p => `<div><b>${p.article}</b> — ${p.modele} — ${p.couleur}</div>`)
      .join('');
  }

  loadProducts();
</script>
