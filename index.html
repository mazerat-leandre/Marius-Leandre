<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Projet Léandre</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .product {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h1>Liste des produits</h1>

    <div id="products">Chargement...</div>

    <script>
        const supabaseUrl = "https://ghgmifhqgqiqignowred.supabase.co";
        const supabaseKey = "sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";

        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function loadProducts() {
            const { data, error } = await supabaseClient
                .from("ListeProduit")
                .select("*")
                .limit(50);

            const container = document.getElementById("products");

            if (error) {
                container.innerHTML = `<p style="color:red;">Erreur Supabase: ${error.message}</p>`;
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = "<p>Aucun produit trouvé.</p>";
                return;
            }

            container.innerHTML = "";

            data.forEach(product => {
                const div = document.createElement("div");
                div.className = "product";
                div.innerHTML = `
                    <strong>${product.article}</strong><br>
                    Taille: ${product.taille || "-"} |
                    Modèle: ${product.modele || "-"} |
                    Couleur: ${product.couleur || "-"}
                `;
                container.appendChild(div);
            });
        }

        loadProducts();
    </script>

</body>
</html>
