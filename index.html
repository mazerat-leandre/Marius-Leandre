<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Accès</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --accent:#7c5cff;
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 500px at 95% 0%, rgba(33,212,253,.22), transparent 55%),
        var(--bg);
    }
    .container{width:100%;max-width:560px;padding:20px}
    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }
    h1{margin:0 0 10px 0;font-size:20px;font-weight:800;text-align:center}
    .subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px;line-height:1.4}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0 4px}
    select{
      padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.08);color:white;font-weight:700;min-width:220px;
      outline:none;
    }
    .btn{
      padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.08);color:white;font-weight:800;cursor:pointer;
    }
    .btn.primary{border-color:rgba(124,92,255,.45); background: rgba(124,92,255,.28);}
    .hint{margin-top:12px;color:var(--muted);font-size:12px;text-align:center;line-height:1.4}
    code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:8px}
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Choix de l’environnement</h1>
      <div class="subtitle">
        Par défaut : <b>Production</b>. Tu peux basculer sur <b>Test</b> si besoin.
      </div>

      <div class="row">
        <select id="env">
          <option value="prod">Production</option>
          <option value="test">Test</option>
        </select>

        <button class="btn primary" id="go">Continuer</button>
      </div>

      <div class="hint">
        Astuce : tu peux forcer via l’URL : <code>?env=test</code> ou <code>?env=prod</code>
      </div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const urlEnv = (qs.get("env") || "").toLowerCase();
    const saved = (localStorage.getItem("app_env") || "").toLowerCase();

    const env = (urlEnv === "test" || urlEnv === "prod")
      ? urlEnv
      : (saved === "test" || saved === "prod") ? saved : "prod";

    const sel = document.getElementById("env");
    sel.value = env;

    function go(targetEnv){
      localStorage.setItem("app_env", targetEnv);
      location.href = `./${targetEnv}/index.html`;
    }

    document.getElementById("go").addEventListener("click", () => go(sel.value));
    sel.addEventListener("change", () => localStorage.setItem("app_env", sel.value));

    if (urlEnv === "test" || urlEnv === "prod") {
      go(urlEnv);
    }
  </script>
</body>
</html>
