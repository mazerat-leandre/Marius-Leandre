<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Projet Léandre - Accueil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 1000px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin-top: 16px; }
    .row { margin: 10px 0; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; }
    button { padding: 12px 14px; cursor: pointer; border-radius: 10px; border: 1px solid #ccc; background: #f7f7f7; }
    button.primary { background:#111; color:#fff; border-color:#111; }
    button:disabled { opacity: .5; cursor:not-allowed; }
    .error { color: #b00020; }
    .muted { color:#666; font-size: 0.95em; }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .cardbtn { text-align:left; padding:16px; }
    .cardtitle { font-weight:700; margin-bottom:6px; }
    .cardsub { color:#666; font-size:0.95em; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Projet Léandre</h1>
    <button id="btnLogout" style="display:none;">Se déconnecter</button>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="box" style="display:none;">
    <h2>Connexion</h2>
    <div class="row">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" />
    </div>
    <div class="row">
      <label>Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>
    <button id="btnLogin" class="primary">Se connecter</button>
    <p id="loginMsg" class="error"></p>
    <p class="muted">Accès réservé.</p>
  </div>

  <!-- ACCUEIL -->
  <div id="homeBox" class="box" style="display:none;">
    <h2>Accueil</h2>
    <p class="muted">Choisis une action :</p>

    <div class="grid">
      <button id="goArticles" class="cardbtn primary">
        <div class="cardtitle">Liste des articles</div>
        <div class="cardsub">Voir et filtrer les produits</div>
      </button>

      <button class="cardbtn" disabled>
        <div class="cardtitle">Statistiques</div>
        <div class="cardsub">À venir</div>
      </button>

      <button class="cardbtn" disabled>
        <div class="cardtitle">Ajouter / Modifier</div>
        <div class="cardsub">À venir</div>
      </button>

      <button class="cardbtn" disabled>
        <div class="cardtitle">Photos</div>
        <div class="cardsub">À venir</div>
      </button>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://ghgmifhqgqiqignowred.supabase.co";
    const supabaseKey = "sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const el = (id) => document.getElementById(id);

    function showLogin() {
      el("btnLogout").style.display = "none";
      el("loginMsg").textContent = "";
      el("loginBox").style.display = "";
      el("homeBox").style.display = "none";
    }

    function showHome() {
      el("btnLogout").style.display = "";
      el("loginBox").style.display = "none";
      el("homeBox").style.display = "";
    }

    el("btnLogin").addEventListener("click", async () => {
      el("loginMsg").textContent = "";
      const email = el("email").value.trim();
      const password = el("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        el("loginMsg").textContent = error.message;
        return;
      }
      showHome();
    });

    el("btnLogout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      showLogin();
    });

    el("goArticles").addEventListener("click", () => {
      location.href = "articles.html";
    });

    // Au chargement : si session -> accueil, sinon login
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) showLogin();
      else showHome();
    })();
  </script>
</body>
</html>
