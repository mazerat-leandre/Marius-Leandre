<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Projet Léandre - Modification article</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 980px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin-top: 16px; }
    .grid { display:grid; grid-template-columns: 220px 1fr; gap: 10px 14px; align-items:center; }
    label { font-weight: 600; }
    input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; }
    .actions { display:flex; gap:10px; justify-content:flex-end; margin-top: 16px; flex-wrap: wrap; }
    button { padding: 10px 14px; cursor: pointer; border-radius: 10px; border: 1px solid #ccc; background: #f7f7f7; }
    button.primary { background:#111; color:#fff; border-color:#111; }
    .muted { color:#666; font-size: 0.95em; }
    .error { color:#b00020; }
    .ok { color:#0a7a0a; }
    .readonly { background:#f6f6f6; }

    /* Photos */
    .photos-bar { display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    .photos-grid {
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .photo-card {
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 10px;
      display:flex;
      flex-direction: column;
      gap: 8px;
    }
    .photo-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      background: #f3f3f3;
    }
    .photo-actions {
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 900px) {
      .photos-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Modification article</h1>
    <div>
      <button id="btnBack">Retour articles</button>
      <button id="btnLogout">Se déconnecter</button>
    </div>
  </div>

  <div class="box">
    <div id="status" class="muted">Chargement…</div>
    <div id="msg" style="margin-top:10px;"></div>

    <div id="form" style="display:none; margin-top:16px;">
      <div class="grid">
        <label>ID (technique)</label>
        <input id="id" class="readonly" readonly />

        <label>Numero</label>
        <input id="numero" />

        <label>Article</label>
        <input id="article" />

        <label>Taille</label>
        <input id="taille" />

        <label>Modèle</label>
        <input id="modele" />

        <label>Couleur</label>
        <input id="couleur" />

        <label>Date HA</label>
        <input id="date_ha" placeholder="YYYY-MM-DD" />

        <label>Date mise en ligne</label>
        <input id="date_mise_en_ligne" placeholder="YYYY-MM-DD" />

        <label>Date vente</label>
        <input id="date_vente" placeholder="YYYY-MM-DD" />

        <label>Prix HA</label>
        <input id="prix_ha" placeholder="ex: 36.59" />

        <label>CA encaissé</label>
        <input id="ca_encaisse" placeholder="ex: 49.90" />

        <label>Client</label>
        <input id="client_id" />

        <label>Date réception</label>
        <input id="date_recep" placeholder="YYYY-MM-DD" />

        <label>Qui</label>
        <input id="qui" />
      </div>

      <div class="actions">
        <button id="btnCancel">Annuler</button>
        <button id="btnSave" class="primary">Enregistrer</button>
        <button id="btnClose">Fermer</button>
      </div>
    </div>
  </div>

  <!-- PHOTOS -->
  <div class="box" id="photosBox" style="display:none;">
    <h2 style="margin-top:0;">Photos</h2>

    <div class="photos-bar">
      <input type="file" id="photoFile" accept="image/*" />
      <button id="btnUpload" class="primary">Uploader</button>
      <span id="photosStatus" class="muted"></span>
    </div>

    <div id="photosError" class="error" style="margin-top:10px;"></div>
    <div id="photosGrid" class="photos-grid"></div>
  </div>

  <script>
    const supabaseUrl = "https://ghgmifhqgqiqignowred.supabase.co";
    const supabaseKey = "sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const BUCKET = "Article-photos";

    const el = (id) => document.getElementById(id);
    const msg = (html) => { el("msg").innerHTML = html || ""; };

    const qs = new URLSearchParams(location.search);
    const recordId = qs.get("id");

    let original = null;

    async function ensureAuthOrRedirect() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        location.href = "index.html";
        return null;
      }
      return session;
    }

    function setFormValues(row) {
      el("id").value = row.id ?? "";
      el("numero").value = row.numero ?? row.Numero ?? row["Numero"] ?? "";
      el("article").value = row.article ?? "";
      el("taille").value = row.taille ?? "";
      el("modele").value = row.modele ?? "";
      el("couleur").value = row.couleur ?? "";
      el("date_ha").value = row.date_ha ?? "";
      el("date_mise_en_ligne").value = row.date_mise_en_ligne ?? "";
      el("date_vente").value = row.date_vente ?? "";
      el("prix_ha").value = row.prix_ha ?? "";
      el("ca_encaisse").value = row.ca_encaisse ?? "";
      el("client_id").value = row.client_id ?? "";
      el("date_recep").value = row.date_recep ?? "";
      el("qui").value = row.qui ?? "";
    }

    function getPayload() {
      return {
        numero: el("numero").value.trim() || null,
        article: el("article").value.trim() || null,
        taille: el("taille").value.trim() || null,
        modele: el("modele").value.trim() || null,
        couleur: el("couleur").value.trim() || null,
        date_ha: el("date_ha").value.trim() || null,
        date_mise_en_ligne: el("date_mise_en_ligne").value.trim() || null,
        date_vente: el("date_vente").value.trim() || null,
        prix_ha: el("prix_ha").value.trim() || null,
        ca_encaisse: el("ca_encaisse").value.trim() || null,
        client_id: el("client_id").value.trim() || null,
        date_recep: el("date_recep").value.trim() || null,
        qui: el("qui").value.trim() || null,
      };
    }

    async function loadRecord() {
      if (!recordId) {
        el("status").textContent = "Erreur : id manquant dans l’URL (ex: modificationarticle.html?id=123).";
        msg(`<p class="error">Impossible de charger un article sans identifiant.</p>`);
        return false;
      }

      el("status").textContent = "Chargement…";
      msg("");

      const { data, error } = await supabaseClient
        .from("ListeProduit")
        .select("id, numero, article, taille, modele, couleur, date_ha, date_mise_en_ligne, date_vente, prix_ha, ca_encaisse, client_id, date_recep, qui")
        .eq("id", recordId)
        .single();

      if (error) {
        el("status").textContent = "";
        msg(`<p class="error">Erreur Supabase : ${error.message}</p>`);
        console.error(error);
        return false;
      }

      original = data;
      setFormValues(data);

      el("status").textContent = `Article chargé (id = ${recordId})`;
      el("form").style.display = "";
      el("photosBox").style.display = "";
      return true;
    }

    async function saveRecord() {
      msg("");

      const payload = getPayload();

      if (!payload.article) {
        msg(`<p class="error">Le champ "Article" est obligatoire.</p>`);
        return;
      }

      el("status").textContent = "Enregistrement…";

      const { error } = await supabaseClient
        .from("ListeProduit")
        .update(payload)
        .eq("id", recordId);

      if (error) {
        el("status").textContent = "";
        msg(`<p class="error">Erreur lors de l’enregistrement : ${error.message}</p>`);
        console.error(error);
        return;
      }

      el("status").textContent = "Enregistré.";
      msg(`<p class="ok">Modifications enregistrées.</p>`);
      await loadRecord();
    }

    // =========================
    // Photos
    // =========================
    function setPhotosStatus(text) {
      el("photosStatus").textContent = text || "";
    }

    function setPhotosError(text) {
      el("photosError").textContent = text || "";
    }

    function safeExtFromName(name) {
      const dot = name.lastIndexOf(".");
      if (dot === -1) return "jpg";
      return name.substring(dot + 1).toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    }

    function rand() {
      return Math.random().toString(16).slice(2);
    }

    async function loadPhotos() {
      setPhotosError("");
      setPhotosStatus("Chargement des photos…");
      el("photosGrid").innerHTML = "";

      const { data, error } = await supabaseClient
        .from("article_photos")
        .select("id, article_id, path, is_main, sort_order, created_at")
        .eq("article_id", recordId)
        .order("is_main", { ascending: false })
        .order("sort_order", { ascending: true })
        .order("id", { ascending: true });

      if (error) {
        setPhotosStatus("");
        setPhotosError("Erreur lecture photos : " + error.message);
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        setPhotosStatus("Aucune photo.");
        return;
      }

      setPhotosStatus(`${data.length} photo(s)`);

      // Pour bucket privé : on génère des URLs signées
      for (const p of data) {
        const { data: signed, error: signErr } = await supabaseClient
          .storage
          .from(BUCKET)
          .createSignedUrl(p.path, 60 * 60); // 1 heure

        if (signErr) {
          console.error(signErr);
          continue;
        }

        const card = document.createElement("div");
        card.className = "photo-card";

        const img = document.createElement("img");
        img.src = signed.signedUrl;
        img.alt = "Photo article";

        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent = p.is_main ? "Photo principale" : "";

        const actions = document.createElement("div");
        actions.className = "photo-actions";

        const btnMain = document.createElement("button");
        btnMain.textContent = "Définir principale";
        btnMain.disabled = !!p.is_main;
        btnMain.addEventListener("click", async () => {
          await setMainPhoto(p.id);
        });

        const btnDelete = document.createElement("button");
        btnDelete.textContent = "Supprimer";
        btnDelete.addEventListener("click", async () => {
          if (!confirm("Supprimer cette photo ?")) return;
          await deletePhoto(p.id, p.path);
        });

        actions.appendChild(btnMain);
        actions.appendChild(btnDelete);

        card.appendChild(img);
        card.appendChild(meta);
        card.appendChild(actions);

        el("photosGrid").appendChild(card);
      }
    }
async function compressImage(file) {
  const MAX_SIZE = 800;        // taille max (800px)
  const QUALITY = 0.70;        // compression JPEG

  // Charger l'image
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = dataUrl;
  });

  // Redimensionnement
  let { width, height } = img;

  const ratio = Math.min(MAX_SIZE / width, MAX_SIZE / height);
  width = Math.round(width * ratio);
  height = Math.round(height * ratio);

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, width, height);

  // Compression JPEG
  const blob = await new Promise((resolve) => {
    canvas.toBlob(
      (b) => resolve(b),
      "image/jpeg",
      QUALITY
    );
  });

  return blob;
}


function humanBytes(bytes) {
  if (!bytes && bytes !== 0) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  let v = bytes;
  while (v >= 1024 && i < units.length - 1) {
    v = v / 1024;
    i++;
  }
  return `${v.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
}

    async function uploadPhoto() {
  setPhotosError("");

  const file = el("photoFile").files?.[0];
  if (!file) {
    setPhotosError("Choisis un fichier image.");
    return;
  }

  setPhotosStatus("Compression…");

  try {
    // ⚙️ Réglages : à ajuster selon ton besoin
    const blob = await compressImage(file, {
      maxSize: 1280,          // 1280 px (bon compromis)
      quality: 0.75,          // qualité JPEG
      mimeType: "image/jpeg"  // jpeg léger et compatible
    });

    // Nom de fichier final
    const filename = `${Date.now()}_${Math.random().toString(16).slice(2)}.jpg`;
    const path = `articles/${recordId}/${filename}`;

    console.log("Original:", humanBytes(file.size), "Compressed:", humanBytes(blob.size));

    setPhotosStatus(`Upload… (orig ${humanBytes(file.size)} → ${humanBytes(blob.size)})`);

    // 1) Upload dans Storage (blob compressé)
    const { error: upErr } = await supabaseClient
      .storage
      .from(BUCKET)
      .upload(path, blob, {
        cacheControl: "3600",
        upsert: false,
        contentType: "image/jpeg",
      });

    if (upErr) {
      setPhotosStatus("");
      setPhotosError("Erreur upload : " + upErr.message);
      console.error(upErr);
      return;
    }

    // 2) Insert dans table article_photos
    const { error: dbErr } = await supabaseClient
      .from("article_photos")
      .insert([{
        article_id: Number(recordId),
        path: path,
        is_main: false,
        sort_order: 0
      }]);

    if (dbErr) {
      // rollback storage (best effort)
      await supabaseClient.storage.from(BUCKET).remove([path]);
      setPhotosStatus("");
      setPhotosError("Erreur base : " + dbErr.message);
      console.error(dbErr);
      return;
    }

    el("photoFile").value = "";
    setPhotosStatus("Upload OK.");
    await loadPhotos();

  } catch (e) {
    setPhotosStatus("");
    setPhotosError("Erreur compression : " + (e?.message || e));
    console.error(e);
  }
}

    async function deletePhoto(photoId, path) {
      setPhotosError("");
      setPhotosStatus("Suppression…");

      // 1) supprimer dans Storage
      const { error: rmErr } = await supabaseClient
        .storage
        .from(BUCKET)
        .remove([path]);

      if (rmErr) {
        setPhotosStatus("");
        setPhotosError("Erreur suppression fichier : " + rmErr.message);
        console.error(rmErr);
        return;
      }

      // 2) supprimer la ligne en DB
      const { error: dbErr } = await supabaseClient
        .from("article_photos")
        .delete()
        .eq("id", photoId);

      if (dbErr) {
        setPhotosStatus("");
        setPhotosError("Erreur suppression DB : " + dbErr.message);
        console.error(dbErr);
        return;
      }

      setPhotosStatus("Supprimé.");
      await loadPhotos();
    }

    // Buttons
    el("btnBack").addEventListener("click", () => location.href = "articles.html");
    el("btnClose").addEventListener("click", () => location.href = "articles.html");

    el("btnCancel").addEventListener("click", () => {
      if (!original) return;
      setFormValues(original);
      msg(`<p class="muted">Modifications annulées (retour aux valeurs initiales).</p>`);
    });

    el("btnSave").addEventListener("click", saveRecord);

    el("btnLogout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      location.href = "index.html";
    });

    el("btnUpload").addEventListener("click", uploadPhoto);

    // Boot
    (async () => {
      const session = await ensureAuthOrRedirect();
      if (!session) return;

      const ok = await loadRecord();
      if (!ok) return;

      await loadPhotos();
    })();
  </script>

</body>
