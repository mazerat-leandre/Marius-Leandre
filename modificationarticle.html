<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Modification article</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1220;
  --panel:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.65);
  --accent:#7c5cff;
  --shadow:0 18px 60px rgba(0,0,0,.45);
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.35), transparent 55%),
    radial-gradient(900px 500px at 95% 0%, rgba(33,212,253,.22), transparent 55%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}
.wrap{max-width:1150px;margin:auto;padding:30px 20px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panelHeader{
  padding:15px 20px;
  font-weight:700;
  border-bottom:1px solid var(--border);
}
.gallery{padding:20px}
.hero{
  aspect-ratio:4/3;
  border-radius:16px;
  overflow:hidden;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:15px;overflow:auto}
.thumb{
  width:70px;height:55px;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid transparent;
}
.thumb.active{border-color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover}

.cards{padding:20px;display:grid;gap:18px}
.card{
  background:rgba(255,255,255,.05);
  padding:15px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.08);
}
.cardTitle{font-weight:800;margin-bottom:12px;font-size:14px}

.row{display:flex;flex-direction:column;margin-bottom:10px}
label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
input{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:white;
}
input:focus{outline:none;border-color:var(--accent)}

.btn{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.06);
  color:white;
  cursor:pointer;
  font-weight:600;
}
.btn.primary{background:var(--accent);border:none}
.btn.danger{background:#ff4d6d;border:none}
.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}

.calcBox{
  font-weight:700;
  margin-top:6px;
}
</style>
</head>
<body>

<div class="wrap">
<div class="grid">

<!-- Photos -->
<div class="panel">
<div class="panelHeader">Photos</div>
<div class="gallery">
<div class="hero" id="hero">Aucune photo</div>
<div class="thumbs" id="thumbs"></div>

<input type="file" id="photoInput" accept="image/*" style="margin-top:15px">
</div>
</div>

<!-- Formulaire -->
<div class="panel">
<div class="panelHeader">Modification article</div>
<div class="cards">

<div class="card">
<div class="cardTitle">Identité produit</div>
<div class="row"><label>Numéro</label><input id="numero"></div>
<div class="row"><label>Article</label><input id="article"></div>
<div class="row"><label>Taille</label><input id="taille"></div>
<div class="row"><label>Modèle</label><input id="modele"></div>
<div class="row"><label>Couleur</label><input id="couleur"></div>
</div>

<div class="card">
<div class="cardTitle">Dates & suivi</div>
<div class="row"><label>Date HA</label><input type="date" id="date_ha"></div>
<div class="row"><label>Date mise en ligne</label><input type="date" id="date_mise_en_ligne"></div>
<div class="row"><label>Date vente</label><input type="date" id="date_vente"></div>
<div class="row"><label>Qui</label><input id="qui"></div>
</div>

<div class="card">
<div class="cardTitle">Financier</div>
<div class="row"><label>Prix HA</label><input type="number" id="prix_ha"></div>
<div class="row"><label>CA encaissé</label><input type="number" id="ca_encaisse"></div>
<div class="calcBox" id="calc_financier"></div>
</div>

<div class="card">
<div class="cardTitle">Client & réception</div>
<div class="row"><label>Client</label><input id="client_id"></div>
<div class="row"><label>Date réception</label><input type="date" id="date_recep"></div>
</div>

<div class="actions">
<button class="btn primary" id="saveBtn">Enregistrer</button>
<button class="btn danger" id="deleteBtn">Supprimer</button>
<button class="btn" onclick="window.location='articles.html'">Retour</button>
</div>

</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl="https://ghgmifhqgqiqignowred.supabase.co";
const supabaseKey="sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
const sb=window.supabase.createClient(supabaseUrl,supabaseKey);

const id=new URLSearchParams(location.search).get("id");
if(!id) location.href="articles.html";

async function requireSession(){
 const {data}=await sb.auth.getSession();
 if(!data.session) location.href="index.html";
}
requireSession();

function el(id){return document.getElementById(id)}

function calc(){
 const prix=parseFloat(el("prix_ha").value)||0;
 const ca=parseFloat(el("ca_encaisse").value)||0;
 const marge=ca-prix;
 const coef=(prix>0&&ca>0)?(ca/prix):0;
 el("calc_financier").innerHTML=
   "Marge : "+marge.toFixed(2)+" €<br>Coef : "+coef.toFixed(2);
}
el("prix_ha").addEventListener("input",calc);
el("ca_encaisse").addEventListener("input",calc);

async function load(){
 const {data}=await sb.from("ListeProduit").select("*").eq("id",id).single();
 if(!data) return;

 Object.keys(data).forEach(k=>{
   if(el(k)) el(k).value=data[k]||"";
 });
 calc();
 loadPhotos();
}
load();

async function loadPhotos(){
 const {data}=await sb.from("article_photos")
 .select("*").eq("article_id",id)
 .order("is_main",{ascending:false});

 const hero=el("hero");
 const thumbs=el("thumbs");
 thumbs.innerHTML="";
 if(!data||!data.length){hero.innerHTML="Aucune photo";return;}

 const main=data.find(p=>p.is_main)||data[0];
 const {data:url}=await sb.storage.from("Article-photos")
 .createSignedUrl(main.path,3600);

 hero.innerHTML="<img src='"+url.signedUrl+"'>";

 for(const p of data){
   const {data:u}=await sb.storage.from("Article-photos")
   .createSignedUrl(p.path,3600);
   const d=document.createElement("div");
   d.className="thumb"+(p.id===main.id?" active":"");
   d.innerHTML="<img src='"+u.signedUrl+"'>";
   d.onclick=()=>hero.innerHTML="<img src='"+u.signedUrl+"'>";
   thumbs.appendChild(d);
 }
}

el("photoInput").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file) return;

 const path="articles/"+id+"/"+Date.now()+"_"+file.name;
 await sb.storage.from("Article-photos").upload(path,file);

 const {count}=await sb.from("article_photos")
 .select("*",{count:"exact",head:true})
 .eq("article_id",id);

 await sb.from("article_photos").insert({
   article_id:id,
   path,
   is_main:count===0,
   sort_order:0
 });

 loadPhotos();
});

el("saveBtn").onclick=async ()=>{
 const payload={
   numero:el("numero").value,
   article:el("article").value,
   taille:el("taille").value,
   modele:el("modele").value,
   couleur:el("couleur").value,
   date_ha:el("date_ha").value,
   date_mise_en_ligne:el("date_mise_en_ligne").value,
   date_vente:el("date_vente").value,
   qui:el("qui").value,
   prix_ha:el("prix_ha").value,
   ca_encaisse:el("ca_encaisse").value,
   client_id:el("client_id").value,
   date_recep:el("date_recep").value
 };
 await sb.from("ListeProduit").update(payload).eq("id",id);
 alert("Enregistré");
};

el("deleteBtn").onclick=async ()=>{
 if(!confirm("Supprimer cet article ?")) return;
 await sb.from("ListeProduit").delete().eq("id",id);
 location.href="articles.html";
};
</script>
</body>
</html>
