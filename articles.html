<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Projet Léandre - Articles</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Tabulator -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 1250px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    button { padding: 10px 14px; cursor: pointer; border-radius: 10px; border: 1px solid #ccc; background: #f7f7f7; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin-top: 16px; }
    .muted { color:#666; font-size: 0.95em; }
    .error { color:#b00020; }
    #table { margin-top: 12px; }

    .edit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }
    .edit-btn:hover { background: #f3f3f3; }

    /* Petit confort : champs filtre en header */
    .tabulator .tabulator-header .tabulator-col .tabulator-header-filter input{
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>Articles</h1>
    <div>
      <button id="btnHome">Accueil</button>
      <button id="btnLogout">Se déconnecter</button>
    </div>
  </div>

  <div class="box">
    <div class="muted">
      Colonnes : filtres par colonne, déplacement (glisser-déposer), redimensionnement, groupement.
    </div>

    <div style="display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap: wrap;">
      <label class="muted" for="groupBy">Grouper par :</label>
      <select id="groupBy">
        <option value="">(aucun)</option>
        <option value="taille">Taille</option>
        <option value="modele">Modèle</option>
        <option value="couleur">Couleur</option>
        <option value="qui">Qui</option>
        <option value="client_id">Client</option>
      </select>

      <button id="btnReload">Recharger</button>
      <span id="status" class="muted"></span>
    </div>

    <div id="table"></div>
    <div id="err" class="error" style="margin-top:10px;"></div>
  </div>

  <script>
    // =========================
    // Supabase config
    // =========================
    const supabaseUrl = "https://ghgmifhqgqiqignowred.supabase.co";
    const supabaseKey = "sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const el = (id) => document.getElementById(id);

    // =========================
    // Helpers affichage
    // =========================
    function fmtDate(value) {
      if (!value) return "";
      // Si c'est déjà YYYY-MM-DD, on l'affiche tel quel.
      // Si tu as un timestamp, Tabulator affichera la string; on reste simple ici.
      return String(value);
    }

    function fmtMoney(value) {
      if (value === null || value === undefined || value === "") return "";
      const n = Number(value);
      if (Number.isNaN(n)) return String(value);
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }

    // =========================
    // Auth guard
    // =========================
    async function ensureAuthOrRedirect() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        location.href = "index.html";
        return false;
      }
      return true;
    }

    // =========================
    // Data loading
    // =========================
    async function fetchArticles() {
      el("err").textContent = "";
      el("status").textContent = "Chargement…";

      // On récupère strictement les champs demandés
      const { data, error } = await supabaseClient
        .from("ListeProduit")
        .select([
          "id",
          "numero",   // Numero (affiché)
          "article",
          "taille",
          "modele",
          "couleur",
          "date_ha",
          "date_mise_en_ligne",
          "date_vente",
          "prix_ha",
          "ca_encaisse",
          "client_id",
          "date_recep",
          "qui"
        ].join(","))
        .order("id", { ascending: true })
        .limit(2000);

      if (error) {
        el("status").textContent = "";
        el("err").textContent = "Erreur Supabase: " + error.message;
        console.error(error);
        return [];
      }

      el("status").textContent = `${data.length} lignes`;
      return data;
    }

    // =========================
    // Tabulator table
    // =========================
    let table = null;

    function createOrUpdateTable(rows) {
      if (table) {
        table.replaceData(rows);
        return;
      }

      table = new Tabulator("#table", {
        data: rows,
        height: "680px",
        layout: "fitColumns",
        movableColumns: true,
        resizableColumns: true,
        placeholder: "Aucun article",
        pagination: "local",
        paginationSize: 25,

        columns: [
          // 1) Colonne crayon
          {
            title: "",
            field: "_edit",
            width: 60,
            hozAlign: "center",
            headerSort: false,
            formatter: () => `<span class="edit-btn" title="Modifier">✏️</span>`,
            cellClick: (e, cell) => {
              const row = cell.getRow().getData();
              location.href = `modificationarticle.html?id=${encodeURIComponent(row.id)}`;
            }
          },

          // 2) Ordre des colonnes demandé
          { title: "Num", field: "numero", width: 95, headerFilter: "input" },
          { title: "Article", field: "article", minWidth: 220, headerFilter: "input" },
          { title: "Taille", field: "taille", width: 110, headerFilter: "input" },
          { title: "Modèle", field: "modele", width: 160, headerFilter: "input" },
          { title: "Couleur", field: "couleur", width: 140, headerFilter: "input" },

          {
            title: "HA le",
            field: "date_ha",
            width: 120,
            headerFilter: "input",
            formatter: (cell) => fmtDate(cell.getValue())
          },
          {
            title: "en ligne le",
            field: "date_mise_en_ligne",
            width: 160,
            headerFilter: "input",
            formatter: (cell) => fmtDate(cell.getValue())
          },
          {
            title: "Vendu le",
            field: "date_vente",
            width: 120,
            headerFilter: "input",
            formatter: (cell) => fmtDate(cell.getValue())
          },

          {
            title: "HA €",
            field: "prix_ha",
            width: 120,
            hozAlign: "right",
            headerFilter: "input",
            formatter: (cell) => fmtMoney(cell.getValue())
          },
          {
            title: "Vendu €",
            field: "ca_encaisse",
            width: 130,
            hozAlign: "right",
            headerFilter: "input",
            formatter: (cell) => fmtMoney(cell.getValue())
          },

          { title: "Client", field: "client_id", width: 110, headerFilter: "input" },

          {
            title: "Recu le",
            field: "date_recep",
            width: 140,
            headerFilter: "input",
            formatter: (cell) => fmtDate(cell.getValue())
          },

          { title: "Qui", field: "qui", width: 140, headerFilter: "input" },
        ],
      });
    }

    function applyGrouping(field) {
      if (!table) return;
      if (!field) table.setGroupBy(false);
      else table.setGroupBy(field);
    }

    // =========================
    // UI actions
    // =========================
    el("btnHome").addEventListener("click", () => location.href = "index.html");

    el("btnLogout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      location.href = "index.html";
    });

    el("btnReload").addEventListener("click", async () => {
      const rows = await fetchArticles();
      createOrUpdateTable(rows);
      applyGrouping(el("groupBy").value);
    });

    el("groupBy").addEventListener("change", () => {
      applyGrouping(el("groupBy").value);
    });

    // =========================
    // Boot
    // =========================
    (async () => {
      const ok = await ensureAuthOrRedirect();
      if (!ok) return;

      const rows = await fetchArticles();
      createOrUpdateTable(rows);
    })();
  </script>
</body>
</html>
