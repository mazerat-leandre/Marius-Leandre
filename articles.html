<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Liste des articles</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://unpkg.com/tabulator-tables@5.6.4/dist/css/tabulator_midnight.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.6.4/dist/js/tabulator.min.js"></script>

<style>
:root{
  --bg:#0b1220;
  --panel:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.65);
  --accent:#7c5cff;
  --shadow:0 18px 60px rgba(0,0,0,.45);
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.35), transparent 55%),
    radial-gradient(900px 500px at 95% 0%, rgba(33,212,253,.22), transparent 55%),
    var(--bg);
}
.wrap{
  max-width:1300px;
  margin:auto;
  padding:30px 20px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}
h1{
  margin:0;
  font-size:22px;
  font-weight:800;
}
.actions{
  display:flex;
  gap:10px;
}
.btn{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.08);
  color:white;
  font-weight:700;
  cursor:pointer;
}
.btn:hover{
  background:rgba(124,92,255,.35);
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:15px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}

.iconBtn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  padding:6px 8px;
}
.iconBtn:hover{
  background:rgba(124,92,255,.35);
}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
  <h1>Liste des articles</h1>
  <div class="actions">
    <button class="btn" onclick="window.location='index.html'">Accueil</button>
    <button class="btn" onclick="window.location='admin.html'">Ajouter</button>
  </div>
</div>

<div class="panel">
  <div style="overflow-x:auto;">
    <div id="table"></div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const supabaseUrl="https://ghgmifhqgqiqignowred.supabase.co";
const supabaseKey="sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
const sb=window.supabase.createClient(supabaseUrl,supabaseKey);

async function requireSession(){
  const {data}=await sb.auth.getSession();
  if(!data.session) window.location="index.html";
}
requireSession();

var table = new Tabulator("#table", {
    layout:"fitColumns",
    responsiveLayout:"collapse",
    responsiveLayoutCollapseStartOpen:false,
    pagination:"local",
    paginationSize:20,
    movableColumns:true,
    height:"600px",
    columns:[

        {
            title:"",
            width:50,
            hozAlign:"center",
            headerSort:false,
            formatter:() => "<button class='iconBtn'>👁</button>",
            cellClick:function(e,cell){
                const row = cell.getRow().getData();
                window.location="fichearticle.html?id="+row.id;
            },
            responsive:0
        },

        {
            title:"",
            width:50,
            hozAlign:"center",
            headerSort:false,
            formatter:() => "<button class='iconBtn'>✏</button>",
            cellClick:function(e,cell){
                const row = cell.getRow().getData();
                window.location="modificationarticle.html?id="+row.id;
            },
            responsive:0
        },

        {title:"Article", field:"article", responsive:1},
        {title:"Taille", field:"taille", responsive:2},
        {title:"Couleur", field:"couleur", responsive:3},
        {title:"Modèle", field:"modele", responsive:4},

        {title:"Numéro", field:"numero", responsive:6},
        {title:"Date HA", field:"date_ha", responsive:7},
        {title:"Date mise en ligne", field:"date_mise_en_ligne", responsive:8},
        {title:"Date vente", field:"date_vente", responsive:9},
        {title:"Prix HA", field:"prix_ha", responsive:10},
        {title:"CA encaissé", field:"ca_encaisse", responsive:11}
    ],
});

async function loadData(){
  const {data,error}=await sb
    .from("ListeProduit")
    .select("*")
    .order("id",{ascending:false});

  if(error){
    alert(error.message);
    return;
  }

  table.setData(data);
}

loadData();

</script>

</body>
</html>
