<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Articles</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css">

  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --muted2:rgba(255,255,255,.52);
      --accent:#7c5cff;
      --danger:#ff4d6d;
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 500px at 95% 0%, rgba(33,212,253,.22), transparent 55%),
        radial-gradient(800px 500px at 60% 120%, rgba(45,212,191,.18), transparent 55%),
        var(--bg);
    }
    .wrap{max-width:1200px;margin:0 auto;padding:28px 18px 60px}
    .topbar{
      display:flex;align-items:flex-start;justify-content:space-between;
      flex-wrap:wrap;gap:12px;margin-bottom:16px;
    }
    h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.2px}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
    .btn{
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
    }
    .btn:hover{background:rgba(124,92,255,.22)}
    .btn.primary{
      border-color:rgba(124,92,255,.45);
      background:linear-gradient(135deg, rgba(124,92,255,.35), rgba(33,212,253,.14));
    }
    .btn.danger{
      border-color:rgba(255,77,109,.45);
      background:rgba(255,77,109,.12);
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 18px 60px rgba(0,0,0,.45);
      overflow:hidden;
      backdrop-filter: blur(12px);
    }
    .panelHeader{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.03);
      gap:12px;
      flex-wrap:wrap;
    }
    .panelHeader .h{font-weight:900;font-size:14px}
    .panelBody{padding:14px}
    .chip{
      font-size:12px; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.05);
      color:var(--muted);
      font-weight:800;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      width:100%;
    }
    .search{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      flex: 1 1 280px;
      min-width: 220px;
    }
    .search input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-weight:800;
      font-size:13px;
    }
    .search span{color:var(--muted2);font-weight:900}

    .select{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:var(--text);
      font-weight:900;
      font-size:13px;
      outline:none;
      min-width: 140px;
    }
    @media(max-width:520px){
      .select{min-width:120px; padding:9px 10px; font-size:12px}
      .btn{padding:9px 10px; font-size:12px}
      .search{min-width: 180px}
    }

    .errorBox{
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,77,109,.35);
      background:rgba(255,77,109,.10);
      color:rgba(255,255,255,.92);
      display:none;
      font-weight:800;
      font-size:13px;
      line-height:1.4;
      white-space:pre-wrap;
    }

    /* Tabulator compact */
    .tabulator{
      border:none !important;
      background:transparent !important;
      color:var(--text) !important;
      font-size:12px;
    }
    .tabulator .tabulator-header{
      background:rgba(255,255,255,.04) !important;
      border-bottom:1px solid rgba(255,255,255,.10) !important;
    }
    .tabulator .tabulator-col-title{
      font-weight:900 !important;
      font-size:12px !important;
    }
    .tabulator .tabulator-row{
      background:rgba(255,255,255,.02) !important;
      border-bottom:1px solid rgba(255,255,255,.06) !important;
    }
    .tabulator .tabulator-row:hover{ background:rgba(124,92,255,.10) !important; }
    .tabulator .tabulator-cell{
      border-right:1px solid rgba(255,255,255,.05) !important;
      padding:8px 8px !important;
    }

    a.cellLink{
      color:inherit;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      width:100%;
    }
    a.cellLink:hover{
      text-decoration:underline;
      text-decoration-color: rgba(124,92,255,.65);
      text-underline-offset: 2px;
    }

    /* Statut compact */
    .statusMini{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:22px;
      border-radius:999px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      font-size:11px;
      line-height:1;
      flex:0 0 auto;
    }
    .s-sold{background:rgba(45,212,191,.18); border-color:rgba(45,212,191,.30)}
    .s-online{background:rgba(124,92,255,.18); border-color:rgba(124,92,255,.30)}
    .s-stock{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.16)}

    .ellipsis{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:100%;
      display:inline-block;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Liste des articles</h1>
        <div class="subtitle" id="sub">—</div>
      </div>
      <div class="actions">
        <button class="btn" id="btnHome">Accueil</button>
        <button class="btn primary" id="btnAdd">Ajouter</button>
        <button class="btn" id="btnReload">Recharger</button>
        <button class="btn danger" id="btnLogout">Déconnexion</button>
      </div>
    </div>

    <div class="panel">
      <div class="panelHeader">
        <div class="h">Filtres</div>

        <div class="toolbar">
          <div class="search">
            <span>🔎</span>
            <input id="quickSearch" placeholder="Recherche (article)...">
          </div>

          <select class="select" id="fStatus">
            <option value="">Statut: Tous</option>
            <option value="EN STOCK">En stock</option>
            <option value="EN LIGNE">En ligne</option>
            <option value="VENDU">Vendu</option>
          </select>

          <select class="select" id="fTaille">
            <option value="">Taille: Toutes</option>
          </select>

          <select class="select" id="fCouleur">
            <option value="">Couleur: Toutes</option>
          </select>

          <select class="select" id="fModele">
            <option value="">Modèle: Tous</option>
          </select>

          <button class="btn" id="btnReset">Reset</button>
          <div class="chip" id="countChip">0</div>
        </div>
      </div>

      <div class="panelBody">
        <div style="overflow-x:auto;">
          <div id="table"></div>
        </div>
        <div class="errorBox" id="err"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

  <script>
    const supabaseUrl="https://ghgmifhqgqiqignowred.supabase.co";
    const supabaseKey="sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
    const sb=window.supabase.createClient(supabaseUrl,supabaseKey);

    const el=(id)=>document.getElementById(id);

    function showError(msg){
      el("err").style.display="block";
      el("err").textContent=msg;
    }
    function clearError(){
      el("err").style.display="none";
      el("err").textContent="";
    }

    async function requireSession(){
      const {data, error} = await sb.auth.getSession();
      if (error) throw error;
      if (!data.session){
        window.location.href="index.html";
        return null;
      }
      el("sub").textContent = "Connecté : " + (data.session.user?.email || "—");
      return data.session;
    }

    function norm(v){ return (v ?? "").toString().trim(); }
    function normL(v){ return norm(v).toLowerCase(); }

    function computeStatus(row){
      const dV = row?.date_vente;
      const dM = row?.date_mise_en_ligne;
      if (dV) return "VENDU";
      if (dM) return "EN LIGNE";
      return "EN STOCK";
    }

    function statusShort(full){
      if (full === "VENDU") return "V";
      if (full === "EN LIGNE") return "L";
      return "S";
    }
    function statusClass(full){
      if (full === "VENDU") return "statusMini s-sold";
      if (full === "EN LIGNE") return "statusMini s-online";
      return "statusMini s-stock";
    }

    // Remplit un select avec des valeurs uniques
    function fillSelect(selectId, values, emptyLabel){
      const s = el(selectId);
      const current = s.value;

      s.innerHTML = "";
      const o0 = document.createElement("option");
      o0.value = "";
      o0.textContent = emptyLabel;
      s.appendChild(o0);

      values
        .filter(v => norm(v) !== "")
        .map(v => norm(v))
        .sort((a,b)=>a.localeCompare(b, "fr", { sensitivity:"base" }))
        .forEach(v=>{
          const o = document.createElement("option");
          o.value = v;
          o.textContent = v;
          s.appendChild(o);
        });

      // tenter de restaurer la sélection
      if ([...s.options].some(o=>o.value===current)) s.value = current;
    }

    function applyFilters(){
      if (!window.__table) return;

      const q = normL(el("quickSearch").value);
      const st = norm(el("fStatus").value);
      const ta = norm(el("fTaille").value);
      const co = norm(el("fCouleur").value);
      const mo = norm(el("fModele").value);

      window.__table.clearFilter();

      window.__table.addFilter((data)=>{
        if (q){
          // recherche sur article + modele/couleur/taille pour aider
          const hay = [data.article, data.modele, data.couleur, data.taille].map(normL).join(" | ");
          if (!hay.includes(q)) return false;
        }
        if (st && data.__status !== st) return false;
        if (ta && norm(data.taille) !== ta) return false;
        if (co && norm(data.couleur) !== co) return false;
        if (mo && norm(data.modele) !== mo) return false;
        return true;
      });

      // compteur visible
      el("countChip").textContent = String(window.__table.getDataCount("active"));
    }

    function buildTable(){
      if (!window.Tabulator) throw new Error("Tabulator non chargé (CDN bloqué).");

      return new Tabulator("#table", {
        layout:"fitColumns",
        responsiveLayout:"collapse",
        responsiveLayoutCollapseStartOpen:false,
        height:"680px",
        placeholder:"Aucune donnée",

        columns:[
          {
            title:"St",
            field:"__status",
            width:64,
            headerSort:false,
            responsive:0,
            formatter:(cell)=>{
              const row = cell.getRow().getData();
              const id = row?.id;
              const full = cell.getValue();
              const href = "fichearticle.html?id=" + encodeURIComponent(id);
              return `<a class="cellLink" href="${href}" title="${full}">
                        <span class="${statusClass(full)}">${statusShort(full)}</span>
                      </a>`;
            }
          },
          {
            title:"Article",
            field:"article",
            minWidth:200,
            widthGrow:6,
            headerSort:true,
            responsive:0,
            formatter:(cell)=>{
              const row = cell.getRow().getData();
              const id = row?.id;
              const v = (cell.getValue() ?? "").toString();
              const href = "fichearticle.html?id=" + encodeURIComponent(id);
              return `<a class="cellLink" href="${href}" title="Ouvrir la fiche">
                        <span class="ellipsis">${v}</span>
                      </a>`;
            }
          },
          {
            title:"T",
            field:"taille",
            width:70,
            responsive:2
          },
          {
            title:"Coul.",
            field:"couleur",
            width:95,
            responsive:3
          },
          {
            title:"Mod.",
            field:"modele",
            minWidth:120,
            widthGrow:2,
            responsive:4
          },
        ],
      });
    }

    let __allRows = [];

    async function loadData(table){
      clearError();

      const {data, error} = await sb
        .from("ListeProduit")
        .select("id, article, taille, modele, couleur, date_mise_en_ligne, date_vente")
        .order("id", {ascending:false})
        .limit(3000);

      if (error) throw error;

      __allRows = (data || []).map(r => ({ ...r, __status: computeStatus(r) }));

      table.setData(__allRows);

      // Remplir les dropdowns à partir des données
      fillSelect("fTaille", __allRows.map(x=>x.taille), "Taille: Toutes");
      fillSelect("fCouleur", __allRows.map(x=>x.couleur), "Couleur: Toutes");
      fillSelect("fModele", __allRows.map(x=>x.modele), "Modèle: Tous");

      // init count + filtres
      el("countChip").textContent = String(__allRows.length);
      applyFilters();
    }

    // Actions
    el("btnHome").addEventListener("click", ()=>window.location.href="index.html");
    el("btnAdd").addEventListener("click", ()=>window.location.href="admin.html");
    el("btnReload").addEventListener("click", async ()=>{
      try{ await loadData(window.__table); } catch(err){ console.error(err); showError(err?.message || err); }
    });
    el("btnLogout").addEventListener("click", async ()=>{
      await sb.auth.signOut();
      window.location.href="index.html";
    });

    // Events filtres
    el("quickSearch").addEventListener("input", ()=>applyFilters());
    el("fStatus").addEventListener("change", ()=>applyFilters());
    el("fTaille").addEventListener("change", ()=>applyFilters());
    el("fCouleur").addEventListener("change", ()=>applyFilters());
    el("fModele").addEventListener("change", ()=>applyFilters());

    el("btnReset").addEventListener("click", ()=>{
      el("quickSearch").value = "";
      el("fStatus").value = "";
      el("fTaille").value = "";
      el("fCouleur").value = "";
      el("fModele").value = "";
      applyFilters();
    });

    (async function main(){
      try{
        await requireSession();
        window.__table = buildTable();
        await loadData(window.__table);
      }catch(err){
        console.error(err);
        showError("Erreur : " + (err?.message || err));
      }
    })();
  </script>
</body>
</html>
