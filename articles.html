<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Articles</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css">

<style>
:root{
  --bg:#0b1220;
  --panel:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.65);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system;
  color:var(--text);
  background:var(--bg);
}

.wrap{max-width:1200px;margin:auto;padding:24px 16px}

.topbar{
  display:flex;justify-content:space-between;flex-wrap:wrap;
  gap:10px;margin-bottom:10px;
}

h1{margin:0;font-size:20px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
  align-items:center;
}

.search{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  flex:1 1 220px;
}

.search input{
  background:transparent;
  border:none;
  outline:none;
  color:white;
  font-size:12px;
  width:100%;
}

.input,.select{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:12px;
  font-weight:700;
  outline:none;
}

.input{min-width:110px}
.select{min-width:140px}

/* champ N ultra compact */
.inputN{
  width:60px;
  text-align:center;
  font-weight:800;
}

.select option{
  background:#0b1220;
  color:white;
}

.chip{
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
}

.tabulator{
  background:transparent !important;
  border:none !important;
  font-size:12px;
}

.tabulator-row{
  background:rgba(255,255,255,.03) !important;
}

.tabulator-row:hover{
  background:rgba(124,92,255,.15) !important;
}

.tabulator-cell{
  padding:6px !important;
}

a.cellLink{
  text-decoration:none;
  color:inherit;
}

.statusMini{
  width:30px;height:20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:999px;
  font-size:10px;font-weight:800;
  background:rgba(255,255,255,.08);
}

.numMini{
  font-size:10px;
  font-weight:800;
}

@media(max-width:520px){
  .filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  .search{grid-column:1/-1}

  .input,.select{
    font-size:11px;
    padding:6px 8px;
  }

  .inputN{
    width:50px;
  }
}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
  <h1>Liste des articles</h1>
  <div class="actions">
    <button class="btn" id="btnReload">Recharger</button>
  </div>
</div>

<div class="filters">
  <div class="search">
    🔎
    <input id="q" placeholder="Recherche article">
  </div>

  <input class="input inputN" id="numero" placeholder="N">

  <select class="select" id="status">
    <option value="">Statut</option>
    <option value="EN STOCK">Stock</option>
    <option value="EN LIGNE">Ligne</option>
    <option value="VENDU">Vendu</option>
  </select>

  <input class="input" id="taille" placeholder="Taille">
  <input class="input" id="couleur" placeholder="Couleur">
  <input class="input" id="modele" placeholder="Modèle">

  <button class="btn" id="reset">Reset</button>
  <div class="chip" id="count">0</div>
</div>

<div id="table"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

<script>
const supabaseUrl="https://ghgmifhqgqiqignowred.supabase.co";
const supabaseKey="sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
const sb=window.supabase.createClient(supabaseUrl,supabaseKey);

function norm(v){return (v??"").toString().trim()}
function normL(v){return norm(v).toLowerCase()}

function computeStatus(r){
  if(r?.date_vente) return "VENDU";
  if(r?.date_mise_en_ligne) return "EN LIGNE";
  return "EN STOCK";
}

function applyFilters(){
  const q=normL(qInput.value);
  const st=statusInput.value;
  const n=norm(numeroInput.value);
  const t=normL(tailleInput.value);
  const c=normL(couleurInput.value);
  const m=normL(modeleInput.value);

  table.clearFilter();

  table.addFilter(d=>{
    if(q && !normL(d.article).includes(q)) return false;
    if(st && d.__status!==st) return false;
    if(n && !norm(d.numero).includes(n)) return false;
    if(t && !normL(d.taille).includes(t)) return false;
    if(c && !normL(d.couleur).includes(c)) return false;
    if(m && !normL(d.modele).includes(m)) return false;
    return true;
  });

  count.textContent=table.getDataCount("active");
}

const table=new Tabulator("#table",{
  layout:"fitColumns",
  responsiveLayout:"collapse",
  columns:[
    {title:"St",field:"__status",width:50,formatter:c=>c.getValue()[0]},
    {title:"N",field:"numero",width:44,hozAlign:"center"},
    {title:"Article",field:"article",widthGrow:4},
    {title:"T",field:"taille",width:60},
    {title:"C",field:"couleur",width:80},
    {title:"M",field:"modele",widthGrow:2}
  ]
});

async function load(){
  const {data}=await sb
    .from("ListeProduit")
    .select("id,numero,article,taille,modele,couleur,date_mise_en_ligne,date_vente")
    .order("id",{ascending:false})
    .limit(3000);

  const rows=data.map(r=>({...r,__status:computeStatus(r)}));
  table.setData(rows);
  count.textContent=rows.length;
}

const qInput=q;
const statusInput=status;
const numeroInput=numero;
const tailleInput=taille;
const couleurInput=couleur;
const modeleInput=modele;

[qInput,statusInput,numeroInput,tailleInput,couleurInput,modeleInput]
.forEach(e=>e.addEventListener(e===statusInput?"change":"input",applyFilters));

reset.onclick=()=>{
  qInput.value="";
  statusInput.value="";
  numeroInput.value="";
  tailleInput.value="";
  couleurInput.value="";
  modeleInput.value="";
  applyFilters();
};

btnReload.onclick=load;

load();
</script>
</body>
</html>
