<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Articles</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tabulator -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css">

  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --muted2:rgba(255,255,255,.52);
      --accent:#7c5cff;
      --danger:#ff4d6d;
      --ok:#2dd4bf;
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 500px at 95% 0%, rgba(33,212,253,.22), transparent 55%),
        radial-gradient(800px 500px at 60% 120%, rgba(45,212,191,.18), transparent 55%),
        var(--bg);
    }
    .wrap{max-width:1350px;margin:0 auto;padding:28px 18px 60px}
    .topbar{
      display:flex;align-items:flex-start;justify-content:space-between;
      flex-wrap:wrap;gap:12px;margin-bottom:16px;
    }
    h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.2px}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
    .btn{
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
    }
    .btn:hover{background:rgba(124,92,255,.22)}
    .btn.primary{
      border-color:rgba(124,92,255,.45);
      background:linear-gradient(135deg, rgba(124,92,255,.35), rgba(33,212,253,.14));
    }
    .btn.danger{
      border-color:rgba(255,77,109,.45);
      background:rgba(255,77,109,.12);
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(12px);
    }
    .panelHeader{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.03);
      gap:12px;
      flex-wrap:wrap;
    }
    .panelHeader .h{font-weight:900;font-size:14px}
    .panelBody{padding:14px}
    .chip{
      font-size:12px; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.05);
      color:var(--muted);
      font-weight:800;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      width:100%;
    }
    .search{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      flex: 1 1 320px;
      min-width: 260px;
    }
    .search input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-weight:800;
      font-size:13px;
    }
    .search span{color:var(--muted2);font-weight:900}

    .select{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:var(--text);
      font-weight:800;
      font-size:13px;
      outline:none;
    }

    .toggle{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }
    .toggle input{accent-color:var(--accent); cursor:pointer}

    .iconBtn{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.15);
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
      padding:6px 9px;
    }
    .iconBtn:hover{background:rgba(124,92,255,.25)}

    .errorBox{
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,77,109,.35);
      background:rgba(255,77,109,.10);
      color:rgba(255,255,255,.92);
      display:none;
      font-weight:800;
      font-size:13px;
      line-height:1.4;
      white-space:pre-wrap;
    }

    /* Tabulator dark harmony */
    .tabulator{
      border:none !important;
      background:transparent !important;
      color:var(--text) !important;
    }
    .tabulator .tabulator-header{
      background:rgba(255,255,255,.04) !important;
      border-bottom:1px solid rgba(255,255,255,.10) !important;
    }
    .tabulator .tabulator-row{
      background:rgba(255,255,255,.02) !important;
      border-bottom:1px solid rgba(255,255,255,.06) !important;
    }
    .tabulator .tabulator-row:hover{
      background:rgba(124,92,255,.10) !important;
    }
    .tabulator .tabulator-cell{border-right:1px solid rgba(255,255,255,.05) !important;}
    .tabulator .tabulator-footer{
      background:rgba(255,255,255,.03) !important;
      border-top:1px solid rgba(255,255,255,.10) !important;
    }
    .tabulator .tabulator-header-filter input{
      background:rgba(255,255,255,.08) !important;
      border:1px solid rgba(255,255,255,.15) !important;
      color:var(--text) !important;
      border-radius:8px !important;
      padding:6px 8px !important;
      font-weight:800 !important;
      font-size:12px !important;
    }
    .tabulator .tabulator-responsive-collapse{
      background:rgba(255,255,255,.03) !important;
      border:1px solid rgba(255,255,255,.10) !important;
      border-radius:14px !important;
      margin:10px !important;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Liste des articles</h1>
        <div class="subtitle" id="sub">—</div>
      </div>
      <div class="actions">
        <button class="btn" id="btnHome">Accueil</button>
        <button class="btn primary" id="btnAdd">Ajouter</button>
        <button class="btn" id="btnReload">Recharger</button>
        <button class="btn danger" id="btnLogout">Déconnexion</button>
      </div>
    </div>

    <div class="panel">
      <div class="panelHeader">
        <div class="h">Tableau</div>
        <div class="toolbar">
          <div class="search">
            <span>🔎</span>
            <input id="quickSearch" placeholder="Recherche rapide : article, modèle, couleur, taille, numéro…">
          </div>

          <select class="select" id="statusFilter">
            <option value="ALL">Statut : Tous</option>
            <option value="STOCK">Stock</option>
            <option value="ONLINE">En ligne</option>
            <option value="SOLD">Vendu</option>
          </select>

          <label class="toggle" title="Afficher uniquement les articles rentables (marge > 0)">
            <input type="checkbox" id="marginPositive">
            Marge &gt; 0
          </label>

          <button class="btn" id="btnReset">Reset filtres</button>

          <div class="chip" id="countChip">0</div>
        </div>
      </div>

      <div class="panelBody">
        <div style="overflow-x:auto;">
          <div id="table"></div>
        </div>
        <div class="errorBox" id="err"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

  <script>
    const supabaseUrl="https://ghgmifhqgqiqignowred.supabase.co";
    const supabaseKey="sb_publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
    const sb=window.supabase.createClient(supabaseUrl,supabaseKey);

    const el=(id)=>document.getElementById(id);

    function showError(msg){
      el("err").style.display="block";
      el("err").textContent=msg;
    }
    function clearError(){
      el("err").style.display="none";
      el("err").textContent="";
    }

    async function requireSession(){
      const {data, error} = await sb.auth.getSession();
      if (error) throw error;
      if (!data.session){
        window.location.href="index.html";
        return null;
      }
      el("sub").textContent = "Connecté : " + (data.session.user?.email || "—");
      return data.session;
    }

    function toNumber(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeStr(v){
      return (v ?? "").toString().toLowerCase().trim();
    }

    // Colonne "Statut" calculée (non affichée sur mobile en priorité)
    function computeStatus(row){
      // vendu si date_vente existe
      // en ligne si date_mise_en_ligne existe
      // sinon stock
      const dV = row?.date_vente;
      const dM = row?.date_mise_en_ligne;
      if (dV) return "VENDU";
      if (dM) return "EN LIGNE";
      return "STOCK";
    }

    function computeMarge(row){
      const ca = toNumber(row?.ca_encaisse);
      const prix = toNumber(row?.prix_ha);
      return ca - prix;
    }

    // Custom header filter comparison (contains, case-insensitive)
    function containsFilter(headerValue, rowValue){
      const hv = normalizeStr(headerValue);
      if (!hv) return true;
      return normalizeStr(rowValue).includes(hv);
    }

    // Custom filters driven by toolbar
    function applyToolbarFilters(){
      if (!window.__table) return;

      const q = normalizeStr(el("quickSearch").value);
      const status = el("statusFilter").value;
      const onlyPositive = el("marginPositive").checked;

      // Clear any previous custom filters (but keep header filters)
      window.__table.clearFilter(true); // true => keeps header filters

      // Apply quick search + status + marge>0 using a single function filter
      window.__table.addFilter((data) => {
        // Quick search over prioritized fields
        if (q){
          const hay = [
            data.numero, data.article, data.taille, data.couleur, data.modele,
            data.qui, data.client_id
          ].map(normalizeStr).join(" | ");
          if (!hay.includes(q)) return false;
        }

        // Status filter
        const st = computeStatus(data);
        if (status === "SOLD" && st !== "VENDU") return false;
        if (status === "ONLINE" && st !== "EN LIGNE") return false;
        if (status === "STOCK" && st !== "STOCK") return false;

        // Margin positive
        if (onlyPositive){
          const m = computeMarge(data);
          if (!(m > 0)) return false;
        }

        return true;
      });
    }

    function buildTable(){
      if (!window.Tabulator) throw new Error("Tabulator non chargé (CDN bloqué).");

      return new Tabulator("#table", {
        layout:"fitColumns",
        responsiveLayout:"collapse",
        responsiveLayoutCollapseStartOpen:false,

        pagination:"local",
        paginationSize:20,

        height:"680px",
        placeholder:"Aucune donnée",

        columns:[
          // Priorités max (toujours visibles)
          {
            title:"",
            width:52,
            hozAlign:"center",
            headerSort:false,
            formatter:() => "<button class='iconBtn' title='Voir'>👁</button>",
            cellClick:(e,cell)=>{
              const row = cell.getRow().getData();
              const id = row?.id;
              if (id === undefined || id === null || id === "") {
                alert("ID manquant sur cette ligne.");
                return;
              }
              window.location.href = "fichearticle.html?id=" + encodeURIComponent(id);
            },
            responsive:0
          },
          {
            title:"",
            width:52,
            hozAlign:"center",
            headerSort:false,
            formatter:() => "<button class='iconBtn' title='Modifier'>✏</button>",
            cellClick:(e,cell)=>{
              const row = cell.getRow().getData();
              const id = row?.id;
              if (id === undefined || id === null || id === "") {
                alert("ID manquant sur cette ligne.");
                return;
              }
              window.location.href = "modificationarticle.html?id=" + encodeURIComponent(id);
            },
            responsive:0
          },

          // Colonnes prioritaires demandées
          {
            title:"Article",
            field:"article",
            headerFilter:"input",
            headerFilterFunc:containsFilter,
            responsive:1
          },
          {
            title:"Taille",
            field:"taille",
            headerFilter:"input",
            headerFilterFunc:containsFilter,
            responsive:2
          },
          {
            title:"Couleur",
            field:"couleur",
            headerFilter:"input",
            headerFilterFunc:containsFilter,
            responsive:3
          },
          {
            title:"Modèle",
            field:"modele",
            headerFilter:"input",
            headerFilterFunc:containsFilter,
            responsive:4
          },

          // Statut & marge (utile en desktop, collapse en mobile)
          {
            title:"Statut",
            field:"__status",
            sorter:"string",
            headerFilter:"input",
            headerFilterFunc:containsFilter,
            responsive:7
          },
          {
            title:"Marge",
            field:"__marge",
            sorter:"number",
            hozAlign:"right",
            formatter:(cell)=>{
              const v = toNumber(cell.getValue());
              const sign = v > 0 ? "+" : "";
              return sign + v.toFixed(2);
            },
            responsive:8
          },

          // Autres colonnes (faible priorité)
          {title:"Numéro", field:"numero", headerFilter:"input", headerFilterFunc:containsFilter, responsive:9},
          {title:"Date HA", field:"date_ha", headerFilter:"input", headerFilterFunc:containsFilter, responsive:10},
          {title:"Date mise en ligne", field:"date_mise_en_ligne", headerFilter:"input", headerFilterFunc:containsFilter, responsive:11},
          {title:"Date vente", field:"date_vente", headerFilter:"input", headerFilterFunc:containsFilter, responsive:12},
          {title:"Prix HA", field:"prix_ha", headerFilter:"input", headerFilterFunc:containsFilter, responsive:13},
          {title:"CA encaissé", field:"ca_encaisse", headerFilter:"input", headerFilterFunc:containsFilter, responsive:14},
          {title:"Qui", field:"qui", headerFilter:"input", headerFilterFunc:containsFilter, responsive:15},
          {title:"Client", field:"client_id", headerFilter:"input", headerFilterFunc:containsFilter, responsive:16},
        ],
      });
    }

    async function loadData(table){
      clearError();

      // Select minimal fields
      const {data, error} = await sb
        .from("ListeProduit")
        .select("id, numero, article, taille, modele, couleur, date_ha, date_mise_en_ligne, date_vente, prix_ha, ca_encaisse, qui, client_id")
        .order("id", {ascending:false})
        .limit(2000);

      if (error) throw error;

      const rows = (data || []).map(r => {
        const status = computeStatus(r);
        const marge = computeMarge(r);
        return { ...r, __status: status, __marge: marge };
      });

      table.setData(rows);
      el("countChip").textContent = String(rows.length);

      // Apply toolbar filters after load
      applyToolbarFilters();
    }

    // Buttons & toolbar events
    el("btnHome").addEventListener("click", ()=>window.location.href="index.html");
    el("btnAdd").addEventListener("click", ()=>window.location.href="admin.html");
    el("btnReload").addEventListener("click", async ()=>{
      try{
        clearError();
        await loadData(window.__table);
      }catch(err){
        console.error(err);
        showError("Erreur rechargement : " + (err?.message || err));
      }
    });
    el("btnLogout").addEventListener("click", async ()=>{
      await sb.auth.signOut();
      window.location.href="index.html";
    });

    el("quickSearch").addEventListener("input", () => applyToolbarFilters());
    el("statusFilter").addEventListener("change", () => applyToolbarFilters());
    el("marginPositive").addEventListener("change", () => applyToolbarFilters());

    el("btnReset").addEventListener("click", ()=>{
      // reset toolbar
      el("quickSearch").value = "";
      el("statusFilter").value = "ALL";
      el("marginPositive").checked = false;

      // reset header filters
      window.__table.clearHeaderFilter();

      // reset custom filters
      window.__table.clearFilter(true);

      // re-apply (none)
      applyToolbarFilters();
    });

    (async function main(){
      try{
        await requireSession();
        window.__table = buildTable();
        await loadData(window.__table);
      }catch(err){
        console.error(err);
        showError("Erreur chargement : " + (err?.message || err));
      }
    })();
  </script>
</body>
</html>
