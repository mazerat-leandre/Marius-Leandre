<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Fiche Produit - Projet Léandre</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 1100px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; }
    h1 { margin-bottom: 6px; }

    .btn {
      padding: 10px 14px;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #f7f7f7;
    }
    .btn.primary { background:#111; color:#fff; border-color:#111; }

    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
      background: #fafafa;
    }

    /* Photo principale */
    .photo-main {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .thumbs {
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap: wrap;
    }

    .thumb {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .thumb.active { border-color:#111; }

    /* Blocs fiche */
    .grid2 {
      display:grid;
      grid-template-columns: 180px 1fr;
      gap: 8px 18px;
      margin-bottom: 14px;
    }

    .label { font-weight: 600; color:#555; }
    .value { color:#111; }

    /* Galerie */
    .photos-grid {
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
    }
    .photos-grid img {
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:10px;
      background:#eee;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div>
    <h1>Fiche Produit</h1>
    <div id="subtitle" class="muted"></div>
  </div>

  <button id="btnEdit" class="btn primary">Modifier</button>
</div>

<!-- Photo principale -->
<div class="box">
  <img id="photoMain" class="photo-main" src="" alt="Photo principale" />

  <div id="thumbs" class="thumbs"></div>
</div>

<!-- Bloc 1 : Identification -->
<div class="box">
  <h2>Identification</h2>
  <div class="grid2">
    <div class="label">Numéro</div><div class="value" id="v_numero"></div>
    <div class="label">Article</div><div class="value" id="v_article"></div>
    <div class="label">Taille</div><div class="value" id="v_taille"></div>
    <div class="label">Modèle</div><div class="value" id="v_modele"></div>
    <div class="label">Couleur</div><div class="value" id="v_couleur"></div>
  </div>
</div>

<!-- Bloc 2 : Process -->
<div class="box">
  <h2>Process & Suivi</h2>
  <div class="grid2">
    <div class="label">Date achat</div><div id="v_date_ha" class="value"></div>
    <div class="label">Mise en ligne</div><div id="v_date_ml" class="value"></div>
    <div class="label">Date vente</div><div id="v_date_vente" class="value"></div>
    <div class="label">Qui</div><div id="v_qui" class="value"></div>
  </div>
</div>

<!-- Bloc 3 : Finance -->
<div class="box">
  <h2>Finance</h2>
  <div class="grid2">
    <div class="label">Prix HA</div><div id="v_prixha" class="value"></div>
    <div class="label">CA encaissé</div><div id="v_ca" class="value"></div>
    <div class="label">Marge dégagée</div><div id="v_marge" class="value"></div>
    <div class="label">Coefficient réalisé</div><div id="v_coef" class="value"></div>
  </div>
</div>

<!-- Bloc 4 : Délais -->
<div class="box">
  <h2>Délais</h2>
  <div class="grid2">
    <div class="label">Délai mise en ligne</div><div id="v_delai_ml" class="value"></div>
    <div class="label">Délai vente</div><div id="v_delai_vente" class="value"></div>
    <div class="label">Achat → Revente</div><div id="v_delai_ar" class="value"></div>
  </div>
</div>

<!-- Bloc 5 : Vente -->
<div class="box">
  <h2>Vente</h2>
  <div class="grid2">
    <div class="label">Client</div><div id="v_client" class="value"></div>
    <div class="label">Date réception</div><div id="v_recep" class="value"></div>
  </div>
</div>

<!-- Bloc 6 : Galerie photos -->
<div class="box">
  <h2>Toutes les photos</h2>
  <div id="gallery" class="photos-grid"></div>
</div>

<script>
  const supabaseUrl = "https://ghgmifhqgqiqignowred.supabase.co";
  const supabaseKey = "sb-publishable-8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  const BUCKET = "Article-photos";

  const qs = new URLSearchParams(location.search);
  const recordId = qs.get("id");

  const el = id => document.getElementById(id);

  /* Format date */
  function fmt(d) { return d ? d : ""; }

  /* Différence en jours */
  function days(a, b) {
    if (!a || !b) return "";
    return `${Math.round((new Date(b) - new Date(a)) / 86400000)} j`;
  }

  /* Chargement article */
  async function loadArticle() {
    const { data, error } = await supabaseClient
      .from("ListeProduit")
      .select("*")
      .eq("id", recordId)
      .single();

    if (error) { alert(error.message); return; }

    el("subtitle").textContent = "Article : " + data.article;

    el("v_numero").textContent = data.numero ?? "";
    el("v_article").textContent = data.article ?? "";
    el("v_taille").textContent = data.taille ?? "";
    el("v_modele").textContent = data.modele ?? "";
    el("v_couleur").textContent = data.couleur ?? "";

    el("v_date_ha").textContent = fmt(data.date_ha);
    el("v_date_ml").textContent = fmt(data.date_mise_en_ligne);
    el("v_date_vente").textContent = fmt(data.date_vente);
    el("v_qui").textContent = fmt(data.qui);

    el("v_prixha").textContent = data.prix_ha || "";
    el("v_ca").textContent = data.ca_encaisse || "";

    const prix = parseFloat(data.prix_ha) || 0;
    const ca = parseFloat(data.ca_encaisse) || 0;

    el("v_marge").textContent = (ca - prix).toFixed(2) + " €";
    el("v_coef").textContent = prix > 0 ? (ca / prix).toFixed(2) : "";

    el("v_delai_ml").textContent = days(data.date_ha, data.date_mise_en_ligne);
    el("v_delai_vente").textContent = days(data.date_mise_en_ligne, data.date_vente);
    el("v_delai_ar").textContent = days(data.date_ha, data.date_vente);

    el("v_client").textContent = data.client_id ?? "";
    el("v_recep").textContent = fmt(data.date_recep);

    await loadPhotos();
  }

  /* Charger photos */
  async function loadPhotos() {
    const { data, error } = await supabaseClient
      .from("article_photos")
      .select("*")
      .eq("article_id", recordId)
      .order("is_main", { ascending:false });

    if (error) return;

    const thumbs = el("thumbs");
    const gallery = el("gallery");
    const photoMain = el("photoMain");

    thumbs.innerHTML = "";
    gallery.innerHTML = "";

    if (!data.length) {
      photoMain.src = "";
      return;
    }

    // Photo principale
    const main = data.find(p => p.is_main) || data[0];

    const { data: signedMain } = await supabaseClient
      .storage.from(BUCKET)
      .createSignedUrl(main.path, 3600);

    photoMain.src = signedMain.signedUrl;

    // Miniatures
    for (const p of data) {
      const { data: signed } = await supabaseClient
        .storage.from(BUCKET)
        .createSignedUrl(p.path, 3600);

      const img = document.createElement("img");
      img.src = signed.signedUrl;
      img.className = "thumb" + (p.id === main.id ? " active" : "");

      img.onclick = () => {
        photoMain.src = signed.signedUrl;

        document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
        img.classList.add("active");
      };

      thumbs.appendChild(img);
    }

    // Galerie complète
    for (const p of data) {
      const { data: signed } = await supabaseClient
        .storage.from(BUCKET)
        .createSignedUrl(p.path, 3600);

      const g = document.createElement("img");
      g.src = signed.signedUrl;

      gallery.appendChild(g);
    }
  }

  el("btnEdit").onclick = () => {
    location.href = "modificationarticle.html?id=" + recordId;
  };

  loadArticle();
</script>

</body>
</html>
