<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fiche Article</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; margin:0; padding:0; background:#f5f5f5; }
    .container { max-width:1100px; margin:auto; padding:20px; }

    .topbar { display:flex; justify-content:space-between; align-items:center; }
    h1 { margin:0; }

    .btn { padding:10px 14px; border-radius:10px; background:#111; color:white; cursor:pointer; }

    .box {
      background:white; padding:20px; margin-top:20px;
      border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }

    .photo-main { width:100%; max-height:420px; object-fit:cover; border-radius:12px; }

    .thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .thumb { width:80px; height:80px; border-radius:8px; object-fit:cover; cursor:pointer; border:2px solid transparent; }
    .thumb.active { border-color:#111; }

    .grid2 { display:grid; grid-template-columns:160px 1fr; gap:8px 18px; }
    .label { font-weight:600; }

    .photos-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
      gap:12px;
    }
    .photos-grid img { width:100%; height:140px; object-fit:cover; border-radius:10px; }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <h1>Fiche Article</h1>
    <button id="btnBack" class="btn">Retour articles</button>
    <button id="btnEdit" class="btn">Modifier</button>
  </div>

  <div id="subtitle" style="margin-bottom:20px;color:#444;"></div>

  <div class="box">
    <img id="photoMain" class="photo-main">
    <div id="thumbs" class="thumbs"></div>
  </div>

  <div class="box">
    <h2>Identification</h2>
    <div class="grid2">
      <div class="label">Numéro</div><div id="v_numero"></div>
      <div class="label">Article</div><div id="v_article"></div>
      <div class="label">Taille</div><div id="v_taille"></div>
      <div class="label">Modèle</div><div id="v_modele"></div>
      <div class="label">Couleur</div><div id="v_couleur"></div>
    </div>
  </div>

  <div class="box">
    <h2>Process</h2>
    <div class="grid2">
      <div class="label">Date achat</div><div id="v_date_ha"></div>
      <div class="label">Mise en ligne</div><div id="v_date_ml"></div>
      <div class="label">Vente</div><div id="v_date_vente"></div>
      <div class="label">Qui</div><div id="v_qui"></div>
    </div>
  </div>

  <div class="box">
    <h2>Finance</h2>
    <div class="grid2">
      <div class="label">Prix HA</div><div id="v_prixha"></div>
      <div class="label">CA</div><div id="v_ca"></div>
      <div class="label">Marge</div><div id="v_marge"></div>
      <div class="label">Coef</div><div id="v_coef"></div>
    </div>
  </div>

  <div class="box">
    <h2>Délais</h2>
    <div class="grid2">
      <div class="label">Mise en ligne</div><div id="v_delai_ml"></div>
      <div class="label">Vente</div><div id="v_delai_vente"></div>
      <div class="label">Achat → Vente</div><div id="v_delai_ar"></div>
    </div>
  </div>

  <div class="box">
    <h2>Toutes les photos</h2>
    <div id="gallery" class="photos-grid"></div>
  </div>

</div>

<script>
/* -------------------------------------------------------------------------- */
/* CONFIG SUPABASE */
/* -------------------------------------------------------------------------- */
const supabaseUrl = "https://ghgmifhqgqiqignowred.supabase.co";
const supabaseKey = "sb-publishable_8D7_EGFMvtFPMuYWgmlyvw_iX8Pf28V";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const BUCKET = "Article-photos";
const qs = new URLSearchParams(location.search);
const recordId = qs.get("id");
const $ = id => document.getElementById(id);

/* -------------------------------------------------------------------------- */
/* FONCTION MAGIQUE QUI RÈGLE LE 401 : attendre la session */
/* -------------------------------------------------------------------------- */

async function waitForSession() {
    let session = null;
    while (!session) {
        const res = await supabaseClient.auth.getSession();
        session = res.data.session;
        if (!session) await new Promise(r=>setTimeout(r,50));
    }
    return session;
}

/* -------------------------------------------------------------------------- */
/* OUTILS */
/* -------------------------------------------------------------------------- */
function fmt(v){ return v || ""; }

function days(a,b){
  if(!a||!b) return "";
  return Math.round((new Date(b)-new Date(a))/86400000) + " j";
}

/* -------------------------------------------------------------------------- */
/* CHARGER ARTICLE */
/* -------------------------------------------------------------------------- */
async function loadArticle(){
  const { data, error } = await supabaseClient
    .from("ListeProduit")
    .select("*")
    .eq("id", recordId)
    .single();

  if(error){ console.error(error); alert(error.message); return; }

  $("subtitle").textContent = "Article : " + data.article;

  $("v_numero").textContent = data.numero;
  $("v_article").textContent = data.article;
  $("v_taille").textContent = data.taille;
  $("v_modele").textContent = data.modele;
  $("v_couleur").textContent = data.couleur;

  $("v_date_ha").textContent = fmt(data.date_ha);
  $("v_date_ml").textContent = fmt(data.date_mise_en_ligne);
  $("v_date_vente").textContent = fmt(data.date_vente);
  $("v_qui").textContent = fmt(data.qui);

  const prix = parseFloat(data.prix_ha)||0;
  const ca = parseFloat(data.ca_encaisse)||0;

  $("v_prixha").textContent = prix;
  $("v_ca").textContent = ca;
  $("v_marge").textContent = (ca-prix).toFixed(2)+" €";
  $("v_coef").textContent = prix>0 ? (ca/prix).toFixed(2) : "";

  $("v_delai_ml").textContent = days(data.date_ha, data.date_mise_en_ligne);
  $("v_delai_vente").textContent = days(data.date_mise_en_ligne, data.date_vente);
  $("v_delai_ar").textContent = days(data.date_ha, data.date_vente);

  await loadPhotos();
}

/* -------------------------------------------------------------------------- */
/* CHARGER PHOTOS */
/* -------------------------------------------------------------------------- */
async function loadPhotos(){
  const { data } = await supabaseClient
    .from("article_photos")
    .select("*")
    .eq("article_id", recordId)
    .order("is_main",{ascending:false});

  const thumbs = $("thumbs");
  const gallery = $("gallery");
  const mainPhoto = $("photoMain");

  thumbs.innerHTML = "";
  gallery.innerHTML = "";

  if(!data || !data.length){
    mainPhoto.src = "";
    return;
  }

  const main = data.find(p=>p.is_main) || data[0];

  const { data:signedMain } = await supabaseClient
    .storage.from(BUCKET)
    .createSignedUrl(main.path,3600);

  mainPhoto.src = signedMain.signedUrl;

  for(const p of data){
    const { data:signed } = await supabaseClient
      .storage.from(BUCKET)
      .createSignedUrl(p.path,3600);

    const img = document.createElement("img");
    img.src = signed.signedUrl;
    img.className = "thumb" + (p.id===main.id?" active":"");

    img.onclick = ()=>{
      mainPhoto.src = signed.signedUrl;
      document.querySelectorAll(".thumb").forEach(t=>t.classList.remove("active"));
      img.classList.add("active");
    };

    thumbs.appendChild(img);
  }

  for(const p of data){
    const { data:signed } = await supabaseClient
      .storage.from(BUCKET)
      .createSignedUrl(p.path,3600);

    const g = document.createElement("img");
    g.src = signed.signedUrl;
    gallery.appendChild(g);
  }
}

/* -------------------------------------------------------------------------- */
/* BOUTON MODIFIER */
/* -------------------------------------------------------------------------- */
$("btnEdit").onclick = ()=>{
  location.href = "modificationarticle.html?id=" + recordId;
};

/* -------------------------------------------------------------------------- */
/* LANCEMENT GLOBAL AVEC SÉCURISATION SESSION */
/* -------------------------------------------------------------------------- */

(async()=>{
  console.log("⏳ Attente session Supabase…");
  await waitForSession();
  console.log("✅ Session restaurée, chargement article…");
  await loadArticle();
})();
</script>

</body>
</html>
